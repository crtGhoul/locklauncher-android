plugins {
    id 'com.android.application'
}

android {
    namespace 'com.crtghoul.locklauncher'
    compileSdk 34

    defaultConfig {
        applicationId 'com.crtghoul.locklauncher'
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug {}
        release {}
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
