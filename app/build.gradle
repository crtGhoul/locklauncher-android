plugins {
    id 'com.android.application'
}

def versionPropsFile = file('../version.properties')
def vCode = 56
def vName = '2.18'
if (versionPropsFile.canRead()) {
    def Properties versionProps = new Properties()
    versionProps.load(new FileInputStream(versionPropsFile))
    if (versionProps['versionCode'] != null) vCode = versionProps['versionCode'].toInteger()
    if (versionProps['versionName'] != null) vName = versionProps['versionName'].toString()
}

android {
    namespace 'com.crtghoul.locklauncher'
    compileSdk 34

    defaultConfig {
        applicationId 'com.crtghoul.locklauncher'
        minSdk 28
        targetSdk 34
        versionCode vCode
        versionName vName
    }

    buildTypes {
        debug {}
        release {}
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
