name: Build & Publish APK Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK (API 34 & Build-Tools 34.0.0)
        uses: android-actions/setup-android@v3

      - name: Install Android Platform 34 & Build-Tools 34.0.0
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Read Version from version.properties
        id: version
        run: |
          VERSION_CODE=$(grep '^versionCode=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          VERSION_NAME=$(grep '^versionName=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "Building Lock Launcher v$VERSION_NAME (code $VERSION_CODE)"

      - name: Prepare Keystore & Build APK via build-apk.sh
        env:
          KEYSTORE_B64: ${{ secrets.LOCKLAUNCHER_KEYSTORE_BASE64 }}
          LOCKLAUNCHER_KEYSTORE_PASS: ${{ secrets.LOCKLAUNCHER_KEYSTORE_PASS }}
          LOCKLAUNCHER_KEY_PASS: ${{ secrets.LOCKLAUNCHER_KEY_PASS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export LOCKLAUNCHER_KEYSTORE="$RUNNER_TEMP/release.keystore"
          fi
          chmod +x ./build-apk.sh
          SDK="$ANDROID_HOME" JDK_DIR="$JAVA_HOME" ./build-apk.sh
          cp build-out/locklauncher.apk ./locklauncher.apk
          cp build-out/locklauncher.apk "./LockLauncher-v${{ steps.version.outputs.name }}.apk"

      - name: Commit Updated Prebuilt APK Back to Branch
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add locklauncher.apk
          if ! git diff --staged --quiet; then
            git commit -m "chore: update compiled locklauncher.apk for v${{ steps.version.outputs.name }} [skip ci]"
            git push origin HEAD:${GITHUB_REF#refs/heads/} || true
          fi

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LockLauncher-v${{ steps.version.outputs.name }}-apk
          path: |
            locklauncher.apk
            LockLauncher-v${{ steps.version.outputs.name }}.apk

      - name: Create or Update GitHub Release v${{ steps.version.outputs.name }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: Lock Launcher v${{ steps.version.outputs.name }} (Build ${{ steps.version.outputs.code }})
          body: |
            - **YouTube & YouTube Music Ad Elimination + SponsorBlock**: Client-side fetch/XHR hook intercepts `/youtubei/v1/player` and `/youtubei/v1/next` payloads to strip `adPlacements` and `adSlots` before the player schedules ads, combined with automatic SponsorBlock segment skipping (`sponsor`, `selfpromo`, `intro`, `outro`, `music_offtopic`).
            - **WebApp Power Controls (PiP, Sleep Timer, Audio-Only OLED Saver)**: Long-press or tap the domain bar in `WebAppActivity` to launch Picture-in-Picture (PiP) mode, set a 15m/30m/60m Sleep Timer, toggle Audio-Only OLED battery saving mode, or switch Desktop/Mobile User-Agent.
            - **De-AI Native Hardware Aesthetic**: Removed decorative emoji clutter across the Home Launcher, Dock Manager, and App Drawer for a clean, hardware-grade OxygenOS 15 interface, plus full Home Widget management.
            - **Flawless Background & App-Switch Audio**: Injects `BACKGROUND_PLAYBACK_JS` (`document.hidden = false`, `hasFocus = true`, blocked `blur`/`pagehide`), holds `AUDIOFOCUS_GAIN`, and maintains an ongoing media notification when switching apps or locking the screen.
          files: |
            locklauncher.apk
            LockLauncher-v${{ steps.version.outputs.name }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
