name: Build & Publish APK Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK (API 34 & Build-Tools 34.0.0)
        uses: android-actions/setup-android@v3

      - name: Install Android Platform 34 & Build-Tools 34.0.0
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Read Version from version.properties
        id: version
        run: |
          VERSION_CODE=$(grep '^versionCode=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          VERSION_NAME=$(grep '^versionName=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "Building Lock Launcher v$VERSION_NAME (code $VERSION_CODE)"

      - name: Prepare Keystore & Build APK via build-apk.sh
        env:
          KEYSTORE_B64: ${{ secrets.LOCKLAUNCHER_KEYSTORE_BASE64 }}
          LOCKLAUNCHER_KEYSTORE_PASS: ${{ secrets.LOCKLAUNCHER_KEYSTORE_PASS }}
          LOCKLAUNCHER_KEY_PASS: ${{ secrets.LOCKLAUNCHER_KEY_PASS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export LOCKLAUNCHER_KEYSTORE="$RUNNER_TEMP/release.keystore"
          fi
          chmod +x ./build-apk.sh
          SDK="$ANDROID_HOME" JDK_DIR="$JAVA_HOME" ./build-apk.sh
          cp build-out/locklauncher.apk ./locklauncher.apk
          cp build-out/locklauncher.apk "./LockLauncher-v${{ steps.version.outputs.name }}.apk"

      - name: Commit Updated Prebuilt APK Back to Branch
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f locklauncher.apk
          if ! git diff --staged --quiet; then
            git commit -m "chore: update compiled locklauncher.apk for v${{ steps.version.outputs.name }} [skip ci]"
            git push origin HEAD:${GITHUB_REF#refs/heads/} || true
          fi

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LockLauncher-v${{ steps.version.outputs.name }}-apk
          path: |
            locklauncher.apk
            LockLauncher-v${{ steps.version.outputs.name }}.apk

      - name: Create or Update GitHub Release v${{ steps.version.outputs.name }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: Lock Launcher v${{ steps.version.outputs.name }} (Build ${{ steps.version.outputs.code }})
          body: |
            - **Wallpaper-Adaptive App Icon Blending — "Chameleon Glass" (`DynamicThemeHelper`, `IconUtil`, `HomeActivity`, `MainActivity`)**: App icons across the Home Grid, Dynamic Island, and Edge Sidebar now blend into your active system wallpaper! Extracts primary, secondary, and tertiary `WallpaperColors` (API 27+, zero storage permissions) + live `OnColorsChangedListener`, replaces harsh opaque adaptive icon plates with a translucent wallpaper-tinted glass squircle + luminous rim, and harmonizes foreground glyphs via a tunable Chameleon `ColorMatrix` (`0–100%` intensity slider in Settings → Appearance & Home long-press menu).
            - **Fixed "Tap to Open" on Android 14/15 (`NowPlayingHelper`, `IconUtil`, `WebAppActivity`)**: Direct `startActivity` + Android 14/15 `MODE_BACKGROUND_ACTIVITY_START_ALLOWED` PendingIntent compat + `singleTask` `onNewIntent` so tapping the Music Square, Dynamic Island, or shortcuts opens/resumes active players immediately without reloading or BAL blocking.
            - **Top-Left Swipe-Down System Music Square (`MediaSession` + `MediaStyle` + Expanded Island Music Square)**: Attaches a live Android `MediaSession.Token` with `PlaybackState`, `MediaMetadata`, and album/brand art so swiping down from the top-left on OxygenOS 15 / Android 13–15 renders the native Quick Settings Music Square widget, plus a rich Music Square inside Home and Dynamic Island.
            - **Installable Standalone Web Apps + Top Utility Bar (`activity_web_app.xml`, `WebAppActivity`)**: Web apps now launch in clean Standalone Installed Mode (hiding the Return/Forward/Reload/Fullscreen bar by default so bottom player controls are never obstructed) and move the collapsible utility bar + `＋ Install` button to the **top** of the screen.
            - **Smooth Cross-Window FLIP & Spring Physics (`SpringAnimator`)**: Uses screen-space coordinates (`getLocationOnScreen`) for Dynamic Island pill-to-deck FLIP morphs across separate `WindowManager` overlays.
            - **Unified Glass Theme, Notification Badges (`Off`/`Dot`/`Number`), & Icon Pack Support**: Preserves all v2.20 Glass & Blur sliders, per-app notification badges, ADW/Nova icon packs, Minimal icons, and InnerTube YT/YTM ad-blocking.
          files: |
            locklauncher.apk
            LockLauncher-v${{ steps.version.outputs.name }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
