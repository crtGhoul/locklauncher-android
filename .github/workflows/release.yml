name: Build & Publish APK Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
    paths:
      - 'app/**'
      - 'version.properties'
      - 'build-apk.sh'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK (API 34 & Build-Tools 34.0.0)
        uses: android-actions/setup-android@v3

      - name: Install Android Platform 34 & Build-Tools 34.0.0
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Read Version from version.properties
        id: version
        run: |
          VERSION_CODE=$(grep '^versionCode=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          VERSION_NAME=$(grep '^versionName=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "Building Lock Launcher v$VERSION_NAME (code $VERSION_CODE)"

      - name: Prepare Keystore & Build APK via build-apk.sh
        env:
          KEYSTORE_B64: ${{ secrets.LOCKLAUNCHER_KEYSTORE_BASE64 }}
          LOCKLAUNCHER_KEYSTORE_PASS: ${{ secrets.LOCKLAUNCHER_KEYSTORE_PASS }}
          LOCKLAUNCHER_KEY_PASS: ${{ secrets.LOCKLAUNCHER_KEY_PASS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export LOCKLAUNCHER_KEYSTORE="$RUNNER_TEMP/release.keystore"
          fi
          chmod +x ./build-apk.sh
          SDK="$ANDROID_HOME" JDK_DIR="$JAVA_HOME" ./build-apk.sh
          cp build-out/locklauncher.apk ./locklauncher.apk
          cp build-out/locklauncher.apk "./LockLauncher-v${{ steps.version.outputs.name }}.apk"

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LockLauncher-v${{ steps.version.outputs.name }}-apk
          path: |
            locklauncher.apk
            LockLauncher-v${{ steps.version.outputs.name }}.apk

      - name: Create or Update GitHub Release v${{ steps.version.outputs.name }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: Lock Launcher v${{ steps.version.outputs.name }} (Build ${{ steps.version.outputs.code }})
          body: |
            - **YouTube & YouTube Music Ad Elimination**: Client-side fetch/XHR hook intercepts `/youtubei/v1/player` and `/youtubei/v1/next` payloads to strip `adPlacements` and `adSlots` at the network JSON layer before the player engine can schedule ads. Eliminates mealbar promos and audio interruptions with zero DOM crashes.
            - **Seamless Google Account Sign-In**: Automatically applies Desktop Chrome User-Agent (`Mozilla/5.0... Chrome/132.0.0.0`) on `music.youtube.com`, bypassing Google's 403 `disallowed_useragent` block and loading the full desktop web player.
            - **Flawless Background & App-Switch Audio**: Injects `BACKGROUND_PLAYBACK_JS` (spoofing `document.hidden`, `visibilityState`, `hasFocus`, and blocking `blur`/`pagehide`), holds `AUDIOFOCUS_GAIN`, and posts an ongoing playback notification so OxygenOS 15's cgroup freezer never kills playback when you go Home or switch to other apps.
            - **OnePlus 13 / OxygenOS 15 Polish**: 120Hz LTPO display mode lock, hardware-accelerated WebView layer, and multi-window OAuth `CookieManager.flush()` persistence.
          files: |
            locklauncher.apk
            LockLauncher-v${{ steps.version.outputs.name }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
